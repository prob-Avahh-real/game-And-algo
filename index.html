<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 min-h-screen relative">
    <!-- Capybara cheering squad -->
    <div class="capybara" id="capybara">
        <svg viewBox="0 0 100 100" width="60" height="60">
            <!-- Body -->
            <ellipse cx="50" cy="55" rx="35" ry="25" fill="#8B7355"/>
            <!-- Head -->
            <ellipse cx="50" cy="35" rx="25" ry="20" fill="#8B7355"/>
            <!-- Ears -->
            <ellipse cx="30" cy="25" rx="8" ry="6" fill="#8B7355"/>
            <ellipse cx="70" cy="25" rx="8" ry="6" fill="#8B7355"/>
            <!-- Eyes -->
            <circle cx="40" cy="32" r="4" fill="#2C1810"/>
            <circle cx="60" cy="32" r="4" fill="#2C1810"/>
            <!-- Nose -->
            <ellipse cx="50" cy="42" rx="6" ry="4" fill="#5C4033"/>
            <!-- Mouth -->
            <path d="M 44 48 Q 50 52 56 48" stroke="#2C1810" stroke-width="2" fill="none"/>
            <!-- Legs -->
            <rect x="25" y="75" width="8" height="15" rx="4" fill="#8B7355"/>
            <rect x="67" y="75" width="8" height="15" rx="4" fill="#8B7355"/>
        </svg>
    </div>
    
    <div class="game-container flex items-center justify-center min-h-screen">
        <div class="header">
            <h1 class="title">2048</h1>
            <div class="scores">
                <div class="score-box">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Best</div>
                    <div class="score-value" id="best-score">0</div>
                </div>
            </div>
        </div>
        <div class="game-intro">
            <p>Join the tiles, get to <strong>2048!</strong></p>
            <button class="new-game-btn" id="new-game-btn">New Game</button>
        </div>
        <div class="game-board" id="game-board">
            <!-- Grid cells will be generated here -->
            <!-- Celebration effects container -->
            <div class="effects-container" id="effects-container"></div>
        </div>
        <div class="game-over" id="game-over" style="display: none;">
            <div class="game-over-text">Game Over!</div>
            <button class="try-again-btn" id="try-again-btn">Try Again</button>
        </div>
        <div class="instructions">
            <p><strong>How to play:</strong> Use arrow keys or swipe to move tiles. Tiles with the same number merge into one!</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
